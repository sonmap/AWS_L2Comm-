{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  # EKS Pod Identity 는 어노테이션을 요구하지 않습니다.
  # IRSA(OIDC) 방식으로 바꾸려면 아래 주석을 해제하고 Pod Identity 연결을 제거하십시오.
  # annotations:
  #   eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRoleArn | quote }}
{{- end }}
